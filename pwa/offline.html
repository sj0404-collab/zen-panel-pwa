<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Офлайн — Zen Panel PWA</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    * { margin: 0; padding: 0; box-sizing: border; }
    body { 
      min-height: 100vh; 
      background: #1f2326; 
      color: #c5c6c7; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    .content { text-align: center; padding: 60px 40px; }
    .icon { width: 80px; height: 80px; margin: 0 auto 24px; }
    h1 { font-size: 24px; margin-bottom: 16px; }
    p { color: #8899a3; font-size: 14px; margin-bottom: 32px; }
    .btn { 
      display: inline-block; 
      padding: 10px 20px; 
      background: #3c4450; 
      color: #c5c6c7; 
      border: none; 
      border-radius: 4px; 
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="icon">📱</div>
    <h1>Вы офлайн</h1>
    <p>Приложение работает в офлайн-режиме. Некоторые функции могут быть ограничены.</p>
    <a class="btn" href="/">Вернуться в приложение</a>
  </div>
</body>
</html>

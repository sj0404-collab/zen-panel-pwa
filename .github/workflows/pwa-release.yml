name: PWA Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        run: |
          gh release create "v${GITHUB_REF#refs/tags/v}" \
            --title "V${GITHUB_REF#refs/tags/v} - PWA Release" \
            --notes "## Zen Panel PWA

            ### Приложение
            - Standalone режим (установка в Via, Chrome, мобильные браузеры)
            - Google Search с forward-traffic логированием
            - Browsec интеграция (симуляция статуса)
            - Extension симулятор окна
            - Service Worker кэширование и офлайн-режим
            - Иконки для установки на домашний экран

            ### Android APK (Zen Panel)
            - WebView панель с интерфейсом
            - Подключение к self-hosted хабу NPM Hub
            - VNC / Linux-экран / Терминалы
            - Файловый менеджер, Git операции
            - API GitHub (репозитории, workflows, сессии)
            - Офлайн-режим через localStorage кэш

            ### Установка
            1. **PWA**: Откройте в браузере (Via, Chrome), меню → "Установить сайт"
            2. **APK**: Соберите релиз вручную (требует keystore и gradle)

            ### Структура
            - `pwa/` — статические файлы PWA (manifest, service worker, HTML)
            - `code/` — Android модуль и корневой проект

            ### Ссылки
            - GitHub: https://github.com/sj0404-collab/zen-panel-pwa
            - PWA файлы: `pwa/`

            ---

            *Релиз создан автоматически при push тега v*"
name: PWA Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "v${GITHUB_REF_NAME}" \
            --title "V${GITHUB_REF_NAME} - PWA Release" \
            --notes "## Zen Panel PWA v${GITHUB_REF_NAME}

            ### Приложение
            - Standalone режим (установка в Via, Chrome, мобильные браузеры)
            - Google Search с forward-traffic логированием
            - Browsec интеграция (симуляция статуса)
            - Extension симулятор окна
            - Service Worker кэширование и офлайн-режим
            - Иконки для установки на домашний экран

            ### Android APK (Zen Panel)
            - WebView панель с интерфейсом на React/Vue стиле
            - Подключение к self-hosted хабу NPM Hub
            - VNC / Linux-экран / Терминалы
            - Файловый менеджер, Git операции
            - API GitHub (репозитории, workflows, сессии)
            - Офлайн-режим через localStorage кэш

            ### Установка
            1. **PWA**: Откройте в браузере (Via, Chrome), меню → "Установить сайт"
               Приложение запускается в standalone режиме без адресной строки
            2. **APK**: Соберите релиз вручную:
               ```bash
               cd code
               ./gradlew assembleRelease
               ```
               (требует keystore в `code/keystore/` и настройки в `gradle.properties`)

            ### Структура репозитория
            - `pwa/` — статические файлы PWA (manifest, service worker, HTML)
            - `code/app/` — Android модуль с WebView панелью
            - `.github/workflows/` — CI workflows

            ### Ссылки
            - GitHub: https://github.com/sj0404-collab/zen-panel-pwa
            - PWA файлы: `pwa/`
            - Android модуль: `code/app/`

            ---

            *Релиз создан автоматически при push тега v*"
name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'code/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('code/gradle/wrapper/gradle-wrapper.properties', 'code/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x code/gradlew

      - name: Build Debug APK
        working-directory: code
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zen-panel-debug-apk
          path: code/app/build/outputs/apk/debug/*.apk

      - name: Build Release APK (unsigned)
        working-directory: code
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: zen-panel-release-apk-unsigned
          path: code/app/build/outputs/apk/release/*.apk
